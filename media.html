<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Dufresne | Media</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <style>
    :root {
      --bg: #050505;
      --text: #f4f4f0;
      --muted: rgba(244, 244, 240, 0.7);
      --line: rgba(244, 244, 240, 0.12);
      --line-strong: rgba(244, 244, 240, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #090909 0%, #050505 100%);
      color: var(--text);
      font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(calc(100% - 40px), 960px);
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      padding-top: 56px;
      max-width: 720px;
    }

    h1 {
      font-size: clamp(2.6rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 24px;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    @media (max-width: 680px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        flex-wrap: wrap;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">Jack Dufresne</a>
      <nav class="nav" aria-label="Main navigation">
        <a class="button" href="index.html">Home</a>
        <a class="button" href="my-work.html">My work</a>
      </nav>
    </header>

    <main>
      <h1>Media</h1>
      <p>Press features, interviews, publications, and visual material will live here.</p>
    </main>
  </div>
</body>
</html>
