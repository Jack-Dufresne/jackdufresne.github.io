<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Dufresne | Home</title>
  <meta
    name="description"
    content="Jack Dufresne is a mechanical engineer focused on AI infrastructure, rack-scale liquid cooling systems, and high-density GPU clusters."
  >
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #050505;
      --bg-gradient-top: #090909;
      --grid: rgba(255, 255, 255, 0.03);
      --text: #f4f4f0;
      --muted: rgba(244, 244, 240, 0.74);
      --line: rgba(244, 244, 240, 0.12);
      --line-strong: rgba(244, 244, 240, 0.22);
      --panel: rgba(255, 255, 255, 0.03);
      --max: 1200px;
    }

    body[data-theme="light"] {
      --bg: #f5f3ef;
      --bg-gradient-top: #ffffff;
      --grid: rgba(0, 0, 0, 0.045);
      --text: #111111;
      --muted: rgba(17, 17, 17, 0.72);
      --line: rgba(17, 17, 17, 0.12);
      --line-strong: rgba(17, 17, 17, 0.22);
      --panel: rgba(0, 0, 0, 0.025);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.1), transparent 34%),
        linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg) 48%, var(--bg) 100%);
      color: var(--text);
      font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 52%, transparent 96%);
      opacity: 0.42;
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      cursor: pointer;
      transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease, color 0.24s ease;
    }

    .work-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease, color 0.24s ease;
    }

    .theme-toggle:hover,
    .work-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(244, 244, 240, 0.34);
    }

    main {
      min-height: calc(100vh - 101px);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
      gap: 40px;
      align-items: center;
      padding: 42px 0 10px;
    }

    .hero {
      max-width: 620px;
    }

    h1 {
      font-size: clamp(3.4rem, 10vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      font-weight: 700;
      margin-bottom: 34px;
    }

    .about-label {
      margin-bottom: 14px;
      color: rgba(244, 244, 240, 0.56);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .about-copy {
      color: var(--muted);
      font-size: clamp(1.02rem, 1.9vw, 1.28rem);
      line-height: 1.8;
    }

    .cta-row {
      margin-top: 30px;
    }

    .visual-wrap {
      display: flex;
      justify-content: flex-end;
    }

    .visual-panel {
      width: min(100%, 500px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .visual-panel img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      filter: grayscale(1) contrast(1.05) brightness(0.94);
      mix-blend-mode: screen;
      opacity: 0.92;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .visual-wrap {
        justify-content: flex-start;
      }

      .visual-panel {
        max-width: 560px;
      }
    }

    @media (max-width: 680px) {
      .shell {
        width: min(calc(100% - 28px), var(--max));
        padding-top: 20px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        flex-wrap: wrap;
      }

      main {
        min-height: auto;
        padding-top: 34px;
      }

      h1 {
        font-size: clamp(3rem, 19vw, 4.6rem);
        margin-bottom: 26px;
      }

      .about-copy {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span>Jack Dufresne</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">Light</button>
        <a class="work-button" href="my-work.html">My work</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Jack Dufresne</h1>
        <p class="about-label">About</p>
        <p class="about-copy">
          Mechanical Engineer — AI Infrastructure
          <br><br>
          Designing and deploying rack-scale liquid cooling systems for high-density GPU clusters.
          Focused on real-world systems: manifolds, CDUs, flow networks, and failure mitigation.
        </p>
        <div class="cta-row">
          <a class="work-button" href="my-work.html">My work</a>
        </div>
      </section>

      <div class="visual-wrap" aria-hidden="true">
        <div class="visual-panel">
          <img src="assets/images/rack_sketch.png" alt="">
        </div>
      </div>
    </main>
  </div>
  <script>
    const themeToggle = document.querySelector(".theme-toggle");
    const root = document.body;
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light") {
      root.setAttribute("data-theme", "light");
    }

    const syncThemeToggle = () => {
      const isLight = root.getAttribute("data-theme") === "light";
      themeToggle.textContent = isLight ? "Dark" : "Light";
      themeToggle.setAttribute("aria-label", isLight ? "Switch to dark mode" : "Switch to light mode");
      themeToggle.setAttribute("aria-pressed", String(isLight));
    };

    syncThemeToggle();

    themeToggle.addEventListener("click", () => {
      const isLight = root.getAttribute("data-theme") === "light";

      if (isLight) {
        root.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
      } else {
        root.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }

      syncThemeToggle();
    });
  </script>
</body>
</html>
