<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Dufresne | Contact</title>
  <meta
    name="description"
    content="Contact Jack Dufresne through LinkedIn, X, or email."
  >
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #050505;
      --bg-gradient-top: #090909;
      --grid: rgba(255, 255, 255, 0.03);
      --text: #f4f4f0;
      --muted: rgba(244, 244, 240, 0.74);
      --line: rgba(244, 244, 240, 0.12);
      --line-strong: rgba(244, 244, 240, 0.22);
      --panel: rgba(255, 255, 255, 0.03);
      --max: 1200px;
    }

    body[data-theme="light"] {
      --bg: #f5f3ef;
      --bg-gradient-top: #ffffff;
      --grid: rgba(0, 0, 0, 0.045);
      --text: #111111;
      --muted: rgba(17, 17, 17, 0.72);
      --line: rgba(17, 17, 17, 0.12);
      --line-strong: rgba(17, 17, 17, 0.22);
      --panel: rgba(0, 0, 0, 0.025);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.1), transparent 34%),
        linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg) 48%, var(--bg) 100%);
      color: var(--text);
      font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 52%, transparent 96%);
      opacity: 0.42;
      pointer-events: none;
    }

    body:not(.is-ready) .shell {
      opacity: 0;
      transform: translateY(14px);
    }

    body.is-leaving .shell {
      opacity: 0;
      transform: translateY(10px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: 32px 0 40px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-self: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-self: end;
    }

    .theme-toggle,
    .nav-button,
    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease, color 0.24s ease;
    }

    .theme-toggle {
      min-width: 48px;
      cursor: pointer;
    }

    .nav-button[aria-current="page"] {
      border-color: rgba(244, 244, 240, 0.34);
      background: rgba(255, 255, 255, 0.08);
    }

    .theme-toggle:hover,
    .nav-button:hover,
    .contact-link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(244, 244, 240, 0.34);
    }

    main {
      padding-top: 42px;
      max-width: 980px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .intro-copy {
      max-width: 700px;
      color: var(--muted);
      font-size: clamp(1.02rem, 1.9vw, 1.22rem);
      line-height: 1.8;
      margin-bottom: 34px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .contact-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .contact-label {
      margin-bottom: 14px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contact-value {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .contact-link {
      width: 100%;
    }

    @media (max-width: 900px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .shell {
        width: min(calc(100% - 28px), var(--max));
        padding-top: 20px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .header-nav,
      .header-actions {
        flex-wrap: wrap;
        justify-self: start;
      }

      h1 {
        font-size: clamp(2.6rem, 16vw, 4.6rem);
      }

      .intro-copy {
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shell {
        transition: none;
      }

      body:not(.is-ready) .shell,
      body.is-leaving .shell {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">Jack Dufresne</a>
      <nav class="header-nav" aria-label="Main navigation">
        <a class="nav-button" href="my-work.html">My work</a>
        <a class="nav-button" href="media.html">Media</a>
        <a class="nav-button" href="contact.html" aria-current="page">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">Light</button>
      </div>
    </header>

    <main>
      <h1>Contact Me</h1>
      <p class="intro-copy">Reach out through LinkedIn, X, or email.</p>

      <section class="contact-grid" aria-label="Contact methods">
        <article class="contact-card">
          <p class="contact-label">Email</p>
          <p class="contact-value">jack.dufresne1@gmail.com</p>
          <a class="contact-link" href="mailto:jack.dufresne1@gmail.com">Send Email</a>
        </article>

        <article class="contact-card">
          <p class="contact-label">X</p>
          <p class="contact-value">x.com/JackDufresne_</p>
          <a class="contact-link" href="https://x.com/JackDufresne_" target="_blank" rel="noopener noreferrer">Open X</a>
        </article>

        <article class="contact-card">
          <p class="contact-label">LinkedIn</p>
          <p class="contact-value">linkedin.com/in/jackdufresne</p>
          <a class="contact-link" href="https://www.linkedin.com/in/jackdufresne/" target="_blank" rel="noopener noreferrer">Open LinkedIn</a>
        </article>
      </section>
    </main>
  </div>
  <script>
    const themeToggle = document.querySelector(".theme-toggle");
    const root = document.body;
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light") {
      root.setAttribute("data-theme", "light");
    }

    const syncThemeToggle = () => {
      const isLight = root.getAttribute("data-theme") === "light";
      themeToggle.textContent = isLight ? "Dark" : "Light";
      themeToggle.setAttribute("aria-label", isLight ? "Switch to dark mode" : "Switch to light mode");
      themeToggle.setAttribute("aria-pressed", String(isLight));
    };

    requestAnimationFrame(() => {
      root.classList.add("is-ready");
    });

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    document.querySelectorAll("a[href]").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        const href = link.getAttribute("href");

        if (
          !href ||
          href.startsWith("#") ||
          href.startsWith("mailto:") ||
          href.startsWith("tel:") ||
          link.hasAttribute("download") ||
          link.target === "_blank"
        ) {
          return;
        }

        const nextUrl = new URL(link.href, window.location.href);

        if (nextUrl.origin !== window.location.origin || nextUrl.href === window.location.href) {
          return;
        }

        if (reduceMotion.matches) {
          return;
        }

        event.preventDefault();
        root.classList.remove("is-ready");
        root.classList.add("is-leaving");

        window.setTimeout(() => {
          window.location.href = nextUrl.href;
        }, 180);
      });
    });

    syncThemeToggle();

    themeToggle.addEventListener("click", () => {
      const isLight = root.getAttribute("data-theme") === "light";

      if (isLight) {
        root.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
      } else {
        root.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }

      syncThemeToggle();
    });
  </script>
</body>
</html>
